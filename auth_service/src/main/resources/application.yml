server:
port: 8081
spring:
  application:
  name: auth-service

  datasource:
  url: ${AUTH\_DB\_URL:jdbc:postgresql://localhost:5431/auth\_db}
  username: ${DB\_USER:postgres}
  password: ${DB\_PASSWORD:postgres}
  driver-class-name: org.postgresql.Driver
  hikari:
  pool-name: AuthHikariPool
  maximum-pool-size: 10
  jpa:
    database-platform:
    org.hibernate.dialect.PostgreSQLDialect hibernate:
    ddl-auto: validate # Схема полностью контролируется Liquibase open-in-view: false
  liquibase:
  enabled:
  true change-log: classpath:db/changelog/changelog-auth.xml
jwt:
  secret: ${JWT_SECRET:default-very-secure-secret-key-at-least-256-bits-long-32-bytes!}
  expiration-ms: 3600000