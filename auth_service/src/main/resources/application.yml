server:
port: 8081
spring:
  application:
  name: auth-service

  datasource:
  url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5431/auth_db}
  username: ${DB_USER:postgres}
  password: ${DB_PASSWORD:postgres}
  driver-class-name: org.postgresql.Driver
  hikari:
  pool-name: AuthHikariPool
  maximum-pool-size: 10
  jpa:
    database-platform:
    org.hibernate.dialect.PostgreSQLDialect hibernate:
    ddl-auto: validate # Схема полностью контролируется Liquibase open-in-view: false
  liquibase:
  enabled: true
  change-log: classpath:db/changelog/changelog-auth.xml
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000