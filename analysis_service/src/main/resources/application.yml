server:
port: 8083
spring:
  liquibase:
  enabled: true
  change-log: classpath:db/changelog/changelog-analysis.xml
threads:
  virtual:
  enabled: true

application:
  name: analysis-service

  datasource:
    url: ${ANALYSIS_DB_URL:jdbc:postgresql://localhost:5434/analysis_db}
    username: ${ANALYSIS_DB_USER:analysis_user}
    password: ${ANALYSIS_DB_PASS:passw}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AnalysisHikariPool
      maximum-pool-size: 20

jpa:
  open-in-view: false
  database-platform: org.hibernate.dialect.PostgreSQLDialect
  hibernate:
    ddl-auto: validate
  properties:
    hibernate:
      format_sql: true
kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analysis-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.shared.dto.*"
        spring.json.value.default.type: com.shared.dto.analysis.ReviewAnalysisEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    ai:
      vectorstore:
        pgvector:
          initialize-schema: true
          index-type: HNSW
          distance-type: COSINE_DISTANCE
          dimensions: 1536
      openai:
        # Заглушка ключа для прохождения внутренней валидации Spring AI
        api-key: ${LLM_API_KEY:lm-studio-dummy-key}

        base-url: ${LLM_BASE_URL:http://docker.internal}
        chat:
          options:
            model: ${LLM_MODEL:loaded-model}
            temperature: 0.3
jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

