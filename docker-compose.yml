version: '3.8'

services:

  # ==================== AUTH SERVICE ====================

  auth-postgres:
    image: postgres:16
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: passw
    ports:
      - "5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-liquibase:
    image: liquibase/liquibase:4.25.1
    container_name: auth-liquibase
    depends_on:
      auth-postgres:
        condition: service_healthy
    volumes:
      - .:/liquibase/changelog
    command: >
      --driver=org.postgresql.Driver
      --url=jdbc:postgresql://auth-postgres:5432/auth_db
      --username=auth_user
      --password=passw
      --changeLogFile=changelogs/homework-2/auth_service/changelog-auth.xml
      --searchPath=/liquibase/changelog
      update

  # ==================== ANALYSIS SERVICE ====================

  analysis-postgres:
    image: postgres:16
    container_name: analysis-postgres
    environment:
      POSTGRES_DB: analysis_db
      POSTGRES_USER: analysis_user
      POSTGRES_PASSWORD: passw
    ports:
      - "5434:5432"
    volumes:
      - analysis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analysis_user -d analysis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  analysis-liquibase:
    image: liquibase/liquibase:4.25.1
    container_name: analysis-liquibase
    depends_on:
      analysis-postgres:
        condition: service_healthy
    volumes:
      - .:/liquibase/changelog
    command: >
      --driver=org.postgresql.Driver
      --url=jdbc:postgresql://analysis-postgres:5432/analysis_db
      --username=analysis_user
      --password=passw
      --changeLogFile=changelogs/homework-2/analysis_service/changelog-analysis.xml
      --searchPath=/liquibase/changelog
      update

  # ==================== REVIEW SERVICE ====================

  review-postgres:
    image: pgvector/pgvector:pg16
    container_name: review-postgres
    environment:
      POSTGRES_DB: review_db
      POSTGRES_USER: review_user
      POSTGRES_PASSWORD: passw
    ports:
      - "5435:5432"
    volumes:
      - review-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_user -d review_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  review-liquibase:
    image: liquibase/liquibase:4.25.1
    container_name: review-liquibase
    depends_on:
      review-postgres:
        condition: service_healthy
    volumes:
      - .:/liquibase/changelog
    command: >
      --driver=org.postgresql.Driver
      --url=jdbc:postgresql://review-postgres:5432/review_db
      --username=review_user
      --password=passw
      --changeLogFile=changelogs/homework-2/review_service/changelog-review.xml
      --searchPath=/liquibase/changelog
      update

volumes:
  auth-postgres-data:
  analysis-postgres-data:
  review-postgres-data: